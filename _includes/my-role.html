{% assign data_key = include.key | default: "my-role" %}
{% assign my-role = site.data.data[data_key] %}
{% if my-role %}
<section class="section summary-section">

  {% if my-role.headline %}
  <h1>{{ my-role.headline }}</h1>
  <br/>
  {% endif %}

  <h2 class="section-title">
    <span class="fa-stack fa-xs">
      <i class="fas fa-circle fa-stack-2x"></i>
      <i class="fas fa-list-ul fa-stack-1x fa-inverse"></i>
    </span>
    {{ my-role.title }}
  </h2>

  <div class="summary">
    {{ my-role.summary | markdownify }}
  </div><!--//summary-->
    
</section><!--//section-->
{% endif %}
